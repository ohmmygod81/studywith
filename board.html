<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>전기기사 스터디</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="screen app-screen active" id="screen-app">

  <!-- 헤더 (shared/common.js의 mountLayout()이 채워 넣음) -->
  <div id="headerMount"></div>

  <div class="app-shell">
  <!-- 데스크톱 좌측 사이드바 (shared/common.js의 mountSidebar()가 채워 넣음) -->
  <div id="sidebarMount"></div>
  <div class="main-col">

  <!-- ── 게시판 탭 ── -->
  <div class="tab-content active" id="tab-board">

    <!-- 글쓰기 카드 -->
    <div class="post-write-card">
      <div class="checkin-title">📸 공부 인증사진 · 게시글 작성</div>
      <textarea class="memo-input" id="postText" style="height:80px;margin-bottom:10px;" placeholder="오늘 공부한 내용이나 하고 싶은 말을 자유롭게 남겨보세요"></textarea>

      <img class="post-image-preview" id="postImagePreview" style="display:none" alt="미리보기">

      <div class="post-write-actions">
        <label class="btn-attach" for="postImage">🖼️ 사진 첨부</label>
        <input type="file" id="postImage" accept="image/*" style="display:none">
        <span class="post-attach-name" id="postAttachName"></span>
        <button class="btn-checkin" id="postSubmitBtn" style="width:auto;padding:0 20px;margin-left:auto;" onclick="submitPost()">게시하기</button>
      </div>
    </div>

    <!-- 게시글 목록 -->
    <div id="postList">
      <div class="loading">⚡ 불러오는 중...</div>
    </div>
  </div>

  </div>
  </div>

  <!-- 하단 탭바 (shared/common.js의 mountLayout()이 채워 넣음) -->
  <div id="navMount"></div>
</div>

<!-- 토스트 -->
<div class="toast" id="toast"></div>

<script src="common.js"></script>
<script>
let currentUser = null;
let myData = {};
let postCache = {};
let openComments = new Set();

mountLayout('📸 게시판', 'board');

requireAuth(async user => {
  currentUser = user;
  myData = await fetchMyData(currentUser.uid);
  if (checkBanned(myData)) return;
  renderHeaderAvatar(myData);
  const admin = isAdmin(currentUser);
  updateAdminNav(admin);
  mountSidebar(myData, 'board', admin);
  loadPosts();
});

// ══════════════════════════════════════
// 이미지 첨부 미리보기
// ══════════════════════════════════════
document.getElementById('postImage').addEventListener('change', e => {
  const file = e.target.files[0];
  const prev = document.getElementById('postImagePreview');
  const nameEl = document.getElementById('postAttachName');
  if (file) {
    if (file.size > 8 * 1024 * 1024) {
      showToast('이미지는 8MB 이하로 올려주세요');
      e.target.value = '';
      prev.style.display = 'none';
      nameEl.textContent = '';
      return;
    }
    nameEl.textContent = file.name;
    const reader = new FileReader();
    reader.onload = ev => { prev.src = ev.target.result; prev.style.display = 'block'; };
    reader.readAsDataURL(file);
  } else {
    prev.style.display = 'none';
    nameEl.textContent = '';
  }
});

// ══════════════════════════════════════
// 게시글 작성
// ══════════════════════════════════════
async function submitPost() {
  const textEl = document.getElementById('postText');
  const text = textEl.value.trim();
  const fileInput = document.getElementById('postImage');
  const file = fileInput.files[0];

  if (!text && !file) { showToast('내용이나 사진을 추가해주세요'); return; }

  const btn = document.getElementById('postSubmitBtn');
  btn.disabled = true;
  btn.textContent = '게시 중...';

  try {
    let imageUrl = null;
    if (file) imageUrl = await uploadImageFile(file, 'posts');

    await db.collection('posts').add({
      uid: currentUser.uid,
      nickname: myData.nickname || '익명',
      text,
      imageUrl,
      likes: [],
      likeCount: 0,
      commentCount: 0,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    textEl.value = '';
    fileInput.value = '';
    document.getElementById('postImagePreview').style.display = 'none';
    document.getElementById('postAttachName').textContent = '';
    showToast('📸 게시글을 올렸어요!');
  } catch (e) {
    console.error(e);
    showToast('오류가 발생했어요. 다시 시도해주세요.');
  } finally {
    btn.disabled = false;
    btn.textContent = '게시하기';
  }
}

// ══════════════════════════════════════
// 게시글 목록
// ══════════════════════════════════════
function loadPosts() {
  const list = document.getElementById('postList');
  list.innerHTML = '<div class="loading">⚡ 불러오는 중...</div>';

  db.collection('posts')
    .orderBy('createdAt', 'desc')
    .limit(30)
    .onSnapshot(snap => {
      if (snap.empty) {
        list.innerHTML = `<div class="empty-state"><div class="ei">📸</div><p>아직 게시글이 없어요<br>첫 인증사진이나 글을 남겨보세요!</p></div>`;
        return;
      }
      list.innerHTML = snap.docs.map(doc => renderPostItem(doc)).join('');
      // 열려있던 댓글창 복원
      openComments.forEach(pid => {
        const box = document.getElementById('comments-' + pid);
        if (box) { box.style.display = 'block'; loadComments(pid); }
      });
    }, err => {
      console.error(err);
      list.innerHTML = `<div class="empty-state"><div class="ei">⚠️</div><p>게시글을 불러오지 못했어요</p></div>`;
    });
}

function renderPostItem(doc) {
  const d = doc.data();
  postCache[doc.id] = d;
  const color = nickColor(d.nickname || '?');
  const initial = nickInitial(d.nickname);
  const isMe = d.uid === currentUser?.uid;
  const admin = isAdmin(currentUser);
  const likes = d.likes || [];
  const iLiked = currentUser && likes.includes(currentUser.uid);

  return `
  <div class="post-item" id="post-${doc.id}">
    <div class="feed-header">
      <div class="feed-avatar" style="background:linear-gradient(135deg,${color},var(--cyan))">${initial}</div>
      <div class="feed-meta">
        <div class="feed-name">${escapeHtml(d.nickname || '익명')}${isMe ? ' <span style="font-size:11px;color:var(--t4)">(나)</span>' : ''}</div>
        <div class="feed-time">${timeAgo(d.createdAt)}</div>
      </div>
    </div>
    ${d.text ? `<div class="post-text">${escapeHtml(d.text)}</div>` : ''}
    ${d.imageUrl ? `<img class="post-img" src="${d.imageUrl}" loading="lazy" onclick="window.open('${d.imageUrl}','_blank')">` : ''}
    <div class="feed-actions">
      <button class="btn-cheer${iLiked ? ' cheered' : ''}" onclick="toggleLike('${doc.id}', this)">
        ❤️ 좋아요 ${d.likeCount > 0 ? `(${d.likeCount})` : ''}
      </button>
      <button class="btn-edit" onclick="toggleComments('${doc.id}')">
        💬 댓글 ${d.commentCount > 0 ? `(${d.commentCount})` : ''}
      </button>
      ${(isMe || admin) ? `<button class="btn-delete" onclick="deletePost('${doc.id}')">🗑️ 삭제${admin && !isMe ? ' (관리자)' : ''}</button>` : ''}
    </div>
    <div class="comments-box" id="comments-${doc.id}" style="display:none">
      <div class="comments-list" id="comments-list-${doc.id}"></div>
      <div class="comment-input-row">
        <input class="comment-input" id="comment-input-${doc.id}" maxlength="300" placeholder="댓글을 입력하세요"
          onkeydown="if(event.key==='Enter'){ event.preventDefault(); submitComment('${doc.id}'); }">
        <button class="btn-comment-send" onclick="submitComment('${doc.id}')">등록</button>
      </div>
    </div>
  </div>`;
}

async function toggleLike(postId, btn) {
  if (!currentUser) return;
  const d = postCache[postId] || {};
  const likes = d.likes || [];
  const willLike = !likes.includes(currentUser.uid);
  const ref = db.collection('posts').doc(postId);
  try {
    await ref.update({
      likes: willLike
        ? firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
        : firebase.firestore.FieldValue.arrayRemove(currentUser.uid),
      likeCount: firebase.firestore.FieldValue.increment(willLike ? 1 : -1)
    });
  } catch (e) {
    console.error(e);
    showToast('오류가 발생했어요. 다시 시도해주세요.');
  }
}

async function deletePost(postId) {
  const d = postCache[postId];
  const isMe = d && d.uid === currentUser?.uid;
  const admin = isAdmin(currentUser);
  if (!isMe && !admin) return;
  if (!confirm(admin && !isMe ? '[관리자] 이 게시글을 삭제할까요? 되돌릴 수 없어요.' : '이 게시글을 삭제할까요? 되돌릴 수 없어요.')) return;

  try {
    if (d && d.imageUrl) await deleteImageByURL(d.imageUrl);

    const commentsSnap = await db.collection('posts').doc(postId).collection('comments').get();
    const batch = db.batch();
    commentsSnap.docs.forEach(c => batch.delete(c.ref));
    batch.delete(db.collection('posts').doc(postId));
    await batch.commit();

    openComments.delete(postId);
    delete postCache[postId];
    showToast('🗑️ 게시글을 삭제했어요');
  } catch (e) {
    console.error(e);
    showToast('오류가 발생했어요. 다시 시도해주세요.');
  }
}

// ══════════════════════════════════════
// 댓글
// ══════════════════════════════════════
function toggleComments(postId) {
  const box = document.getElementById('comments-' + postId);
  if (!box) return;
  const opening = box.style.display === 'none';
  box.style.display = opening ? 'block' : 'none';
  if (opening) { openComments.add(postId); loadComments(postId); }
  else openComments.delete(postId);
}

async function loadComments(postId) {
  const listEl = document.getElementById('comments-list-' + postId);
  if (!listEl) return;
  listEl.innerHTML = '<div class="comment-loading">불러오는 중...</div>';
  try {
    const snap = await db.collection('posts').doc(postId).collection('comments')
      .orderBy('createdAt', 'asc').limit(200).get();
    if (snap.empty) {
      listEl.innerHTML = '<div class="comment-empty">첫 댓글을 남겨보세요!</div>';
      return;
    }
    listEl.innerHTML = snap.docs.map(doc => renderComment(postId, doc)).join('');
  } catch (e) {
    console.error(e);
    listEl.innerHTML = '<div class="comment-empty">댓글을 불러오지 못했어요</div>';
  }
}

function renderComment(postId, doc) {
  const d = doc.data();
  const isMe = d.uid === currentUser?.uid;
  const admin = isAdmin(currentUser);
  const color = nickColor(d.nickname || '?');
  return `
  <div class="comment-item">
    <div class="comment-avatar" style="background:linear-gradient(135deg,${color},var(--cyan))">${nickInitial(d.nickname)}</div>
    <div class="comment-body">
      <div class="comment-name">${escapeHtml(d.nickname || '익명')}</div>
      <div class="comment-text">${escapeHtml(d.text)}</div>
    </div>
    ${(isMe || admin) ? `<button class="comment-del" title="삭제" onclick="deleteComment('${postId}','${doc.id}')">✕</button>` : ''}
  </div>`;
}

async function submitComment(postId) {
  const input = document.getElementById('comment-input-' + postId);
  const text = input.value.trim();
  if (!text) return;
  input.disabled = true;
  try {
    await db.collection('posts').doc(postId).collection('comments').add({
      uid: currentUser.uid,
      nickname: myData.nickname || '익명',
      text,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection('posts').doc(postId).update({
      commentCount: firebase.firestore.FieldValue.increment(1)
    });
    input.value = '';
    loadComments(postId);
  } catch (e) {
    console.error(e);
    showToast('댓글 등록 중 오류가 발생했어요.');
  } finally {
    input.disabled = false;
  }
}

async function deleteComment(postId, commentId) {
  if (!confirm('이 댓글을 삭제할까요?')) return;
  try {
    await db.collection('posts').doc(postId).collection('comments').doc(commentId).delete();
    await db.collection('posts').doc(postId).update({
      commentCount: firebase.firestore.FieldValue.increment(-1)
    });
    loadComments(postId);
    showToast('댓글을 삭제했어요');
  } catch (e) {
    console.error(e);
    showToast('오류가 발생했어요. 다시 시도해주세요.');
  }
}
</script>
</body>
</html>
