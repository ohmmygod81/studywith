<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>전기기사 스터디</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<link rel="stylesheet" href="shared/style.css">
</head>
<body>

<div class="screen auth-screen active" id="screen-auth">
  <div class="auth-logo">
    <div class="logo-icon">⚡</div>
    <h1>전기기사 스터디</h1>
    <div class="logo-sub">같이 공부하면 합격률이 달라집니다</div>
    <div class="exam-chip">📅 2027년 1회차 함께 도전!</div>
  </div>

  <div class="auth-card">
    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">로그인</div>
      <div class="auth-tab" id="tab-signup" onclick="switchAuthTab('signup')">회원가입</div>
    </div>

    <!-- 로그인 폼 -->
    <div id="form-login">
      <div class="form-group">
        <label class="form-label">이메일</label>
        <input class="form-input" type="email" id="login-email" placeholder="이메일 입력">
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <input class="form-input" type="password" id="login-pw" placeholder="비밀번호 입력">
      </div>
      <div class="forgot-pw"><span onclick="openResetModal()">비밀번호를 잊으셨나요?</span></div>
      <button class="btn-primary" onclick="doLogin()">로그인</button>
    </div>

    <!-- 회원가입 폼 -->
    <div id="form-signup" style="display:none">
      <div class="form-group">
        <label class="form-label">별명 (닉네임)</label>
        <input class="form-input" type="text" id="signup-nick" placeholder="ex) 코팅반형배, 전기왕" maxlength="10">
      </div>
      <div class="form-group">
        <label class="form-label">이메일</label>
        <input class="form-input" type="email" id="signup-email" placeholder="이메일 입력">
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <input class="form-input" type="password" id="signup-pw" placeholder="6자리 이상">
      </div>
      <div class="form-group">
        <label class="form-label">시험 목표일</label>
        <input class="form-input" type="date" id="signup-exam" value="2027-01-20">
      </div>
      <button class="btn-primary" onclick="doSignup()">가입하기</button>
    </div>

    <div class="auth-err" id="auth-err"></div>
  </div>
</div>
<!-- ══════════ 비밀번호 재설정 모달 ══════════ -->
<div class="reset-overlay" id="reset-overlay">
  <div class="reset-modal">
    <div class="reset-title">🔑 비밀번호 재설정</div>
    <div class="reset-desc">가입할 때 사용한 이메일을 입력하면<br>재설정 링크를 보내드려요.</div>
    <div class="form-group">
      <label class="form-label">이메일</label>
      <input class="form-input" type="email" id="reset-email" placeholder="이메일 입력">
    </div>
    <div class="reset-msg" id="reset-msg"></div>
    <div class="reset-actions">
      <button class="btn-secondary" onclick="closeResetModal()">취소</button>
      <button class="btn-primary" id="reset-send-btn" onclick="doPasswordReset()">링크 보내기</button>
    </div>
  </div>
</div>

<!-- 토스트 -->
<div class="toast" id="toast"></div>

<script src="shared/common.js"></script>
<script>
// ══════════════════════════════════════
// 로그인 상태면 바로 feed.html로
// ══════════════════════════════════════
auth.onAuthStateChanged(user => {
  if (user) location.href = 'feed.html';
});

function switchAuthTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab==='login');
  document.getElementById('tab-signup').classList.toggle('active', tab==='signup');
  document.getElementById('form-login').style.display  = tab==='login'  ? '' : 'none';
  document.getElementById('form-signup').style.display = tab==='signup' ? '' : 'none';
  document.getElementById('auth-err').style.display = 'none';
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pw    = document.getElementById('login-pw').value;
  try {
    await auth.signInWithEmailAndPassword(email, pw);
    // onAuthStateChanged가 feed.html로 이동시켜줌
  } catch(e) {
    showAuthErr('이메일 또는 비밀번호가 틀렸어요');
  }
}

async function doSignup() {
  const nick  = document.getElementById('signup-nick').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const pw    = document.getElementById('signup-pw').value;
  const exam  = document.getElementById('signup-exam').value;

  if (!nick) { showAuthErr('별명을 입력해주세요'); return; }
  if (nick.length < 2) { showAuthErr('별명은 2자 이상이에요'); return; }
  if (pw.length < 6)   { showAuthErr('비밀번호는 6자 이상이에요'); return; }

  try {
    const cred = await auth.createUserWithEmailAndPassword(email, pw);
    await db.collection('users').doc(cred.user.uid).set({
      nickname: nick,
      examDate: exam,
      streak: 0,
      totalProblems: 0,
      totalDays: 0,
      subjects: {},
      lastCheckin: null,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    // onAuthStateChanged가 feed.html로 이동시켜줌
  } catch(e) {
    if (e.code === 'auth/email-already-in-use') showAuthErr('이미 사용 중인 이메일이에요');
    else showAuthErr('가입 중 오류가 발생했어요');
  }
}

// ══════════════════════════════════════
// 비밀번호 재설정
// ══════════════════════════════════════
function openResetModal() {
  document.getElementById('reset-email').value =
    document.getElementById('login-email').value.trim();
  const msg = document.getElementById('reset-msg');
  msg.style.display = 'none';
  msg.className = 'reset-msg';
  document.getElementById('reset-overlay').classList.add('active');
}

function closeResetModal() {
  document.getElementById('reset-overlay').classList.remove('active');
}

async function doPasswordReset() {
  const email = document.getElementById('reset-email').value.trim();
  const msg = document.getElementById('reset-msg');
  const btn = document.getElementById('reset-send-btn');

  if (!email) {
    msg.textContent = '이메일을 입력해주세요';
    msg.className = 'reset-msg err';
    return;
  }

  btn.disabled = true;
  btn.textContent = '전송 중...';

  try {
    await auth.sendPasswordResetEmail(email);
    msg.textContent = '재설정 링크를 보냈어요! 이메일함(스팸함도)을 확인해주세요 📩';
    msg.className = 'reset-msg ok';
  } catch (e) {
    if (e.code === 'auth/user-not-found') {
      msg.textContent = '가입되지 않은 이메일이에요';
    } else if (e.code === 'auth/invalid-email') {
      msg.textContent = '이메일 형식이 올바르지 않아요';
    } else {
      msg.textContent = '오류가 발생했어요. 다시 시도해주세요';
    }
    msg.className = 'reset-msg err';
  } finally {
    btn.disabled = false;
    btn.textContent = '링크 보내기';
  }
}

function showAuthErr(msg) {
  const el = document.getElementById('auth-err');
  el.textContent = msg;
  el.style.display = 'block';
}
</script>
</body>
</html>
