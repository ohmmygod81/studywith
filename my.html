<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>전기기사 스터디</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="screen app-screen active" id="screen-app">

  <!-- 헤더 (shared/common.js의 mountLayout()이 채워 넣음) -->
  <div id="headerMount"></div>

  <!-- ── 내 기록 탭 ── -->
  <div class="tab-content active" id="tab-my">
    <div class="my-profile-card" id="myProfileCard">
      <div class="my-avatar" id="myAvatar">?</div>
      <div class="my-nickname" id="myNickname">-</div>
      <div class="my-chips">
        <span class="my-chip mc-streak">🔥 <span id="myStreak">0</span>일 연속</span>
        <span class="my-chip mc-total">📚 총 <span id="myTotal">0</span>학습량</span>
        <span class="my-chip mc-rank">⚡ <span id="myRank">-</span>위</span>
      </div>
    </div>

    <div class="my-stats-grid">
      <div class="my-stat">
        <div class="my-stat-num" style="color:var(--blue)" id="statDays">0</div>
        <div class="my-stat-lbl">총 출석일</div>
      </div>
      <div class="my-stat">
        <div class="my-stat-num" style="color:var(--green)" id="statProblems">0</div>
        <div class="my-stat-lbl">총 학습량</div>
      </div>
      <div class="my-stat">
        <div class="my-stat-num" style="color:var(--yellow)" id="statStreak">0</div>
        <div class="my-stat-lbl">연속 출석</div>
      </div>
    </div>

    <!-- 과목별 진도 -->
    <div class="subject-prog-card">
      <div class="sp-title">📊 과목별 학습량</div>
      <div class="sp-item"><div class="sp-name">⚡ 회로이론</div><div class="sp-bar-bg"><div class="sp-bar-fill" id="myBar-회로이론" style="width:0%"></div></div><div class="sp-count" id="myCnt-회로이론">0</div></div>
      <div class="sp-item"><div class="sp-name">🧲 전자기학</div><div class="sp-bar-bg"><div class="sp-bar-fill" id="myBar-전기자기학" style="width:0%"></div></div><div class="sp-count" id="myCnt-전기자기학">0</div></div>
      <div class="sp-item"><div class="sp-name">🎛️ 제어공학</div><div class="sp-bar-bg"><div class="sp-bar-fill" id="myBar-제어공학" style="width:0%"></div></div><div class="sp-count" id="myCnt-제어공학">0</div></div>
      <div class="sp-item"><div class="sp-name">🏭 전력공학</div><div class="sp-bar-bg"><div class="sp-bar-fill" id="myBar-전력공학" style="width:0%"></div></div><div class="sp-count" id="myCnt-전력공학">0</div></div>
      <div class="sp-item"><div class="sp-name">⚙️ 전기기기</div><div class="sp-bar-bg"><div class="sp-bar-fill" id="myBar-전기기기" style="width:0%"></div></div><div class="sp-count" id="myCnt-전기기기">0</div></div>
      <div class="sp-item"><div class="sp-name">📋 KEC</div><div class="sp-bar-bg"><div class="sp-bar-fill" id="myBar-KEC" style="width:0%"></div></div><div class="sp-count" id="myCnt-KEC">0</div></div>
    </div>

    <!-- 스트릭 캘린더 -->
    <div class="streak-card">
      <div class="streak-title">🔥 최근 출석 (28일)</div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px;">
        <div class="streak-wday">월</div><div class="streak-wday">화</div>
        <div class="streak-wday">수</div><div class="streak-wday">목</div>
        <div class="streak-wday">금</div><div class="streak-wday">토</div>
        <div class="streak-wday">일</div>
      </div>
      <div class="streak-grid" id="streakGrid"></div>
    </div>

    <button class="btn-logout" onclick="doLogout()">로그아웃</button>
  </div>

  <!-- 하단 탭바 (shared/common.js의 mountLayout()이 채워 넣음) -->
  <div id="navMount"></div>
</div>

<!-- 토스트 -->
<div class="toast" id="toast"></div>

<script src="common.js"></script>
<script>
let currentUser = null;
let myData = {};

mountLayout('👤 내 기록', 'my');

requireAuth(async user => {
  currentUser = user;
  myData = await fetchMyData(currentUser.uid);
  renderHeaderAvatar(myData);
  updateMyUI();
  loadMyRank();
});

function updateMyUI() {
  const nick = myData.nickname || '-';
  document.getElementById('myNickname').textContent = nick;
  document.getElementById('myStreak').textContent   = myData.streak || 0;
  document.getElementById('myTotal').textContent    = myData.totalProblems || 0;
  document.getElementById('statDays').textContent    = myData.totalDays || 0;
  document.getElementById('statProblems').textContent= myData.totalProblems || 0;
  document.getElementById('statStreak').textContent  = myData.streak || 0;

  const av = document.getElementById('myAvatar');
  av.textContent = nickInitial(nick);
  av.style.background = `linear-gradient(135deg, ${nickColor(nick)}, var(--cyan))`;

  // 과목별 바
  const subs = myData.subjects || {};
  const maxVal = Math.max(...Object.values(subs), 10);
  ['회로이론','전기자기학','제어공학','전력공학','전기기기','KEC'].forEach(s => {
    const cnt = subs[s] || 0;
    const bar = document.getElementById('myBar-' + s);
    const cntEl = document.getElementById('myCnt-' + s);
    if (bar) bar.style.width = (cnt/maxVal*100) + '%';
    if (cntEl) cntEl.textContent = cnt;
  });

  // 스트릭 캘린더
  buildStreakCalendar();
}

// 랭킹 페이지를 거치지 않아도 내 순위를 보여주기 위한 조회
async function loadMyRank() {
  const el = document.getElementById('myRank');
  if (!el || !currentUser) return;
  try {
    const snap = await db.collection('users').orderBy('streak', 'desc').limit(200).get();
    const idx = snap.docs.findIndex(doc => doc.id === currentUser.uid);
    el.textContent = idx >= 0 ? (idx + 1) : '-';
  } catch(e) {
    console.error(e);
  }
}

function buildStreakCalendar() {
  const grid = document.getElementById('streakGrid');
  if (!grid) return;
  const checkins = myData.checkinDates || [];
  const checkinSet = new Set(checkins);
  const today = new Date(); today.setHours(0,0,0,0);
  const cells = [];
  // 28일치
  const start = new Date(today); start.setDate(start.getDate() - 27);
  // 월요일 시작 맞추기
  const dow = (start.getDay() + 6) % 7; // 0=월
  for (let i=0; i<dow; i++) cells.push('<div class="streak-day"></div>');
  for (let i=0; i<28; i++) {
    const d = new Date(start); d.setDate(start.getDate()+i);
    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const isToday = d.getTime() === today.getTime();
    const done = checkinSet.has(ds);
    const cls = isToday ? 'today-dot' : (done ? 'done' : 'empty');
    cells.push(`<div class="streak-day ${cls}" title="${ds}"></div>`);
  }
  grid.innerHTML = cells.join('');
}

async function doLogout() {
  await auth.signOut();
  location.href = 'index.html';
}
</script>
</body>
</html>
