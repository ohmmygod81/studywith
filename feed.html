<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>전기기사 스터디 — 피드</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen app-screen active">
  <div id="headerMount"></div>

  <div class="tab-content active" id="tab-feed">

    <!-- D-Day 배너 -->
    <div class="dday-banner">
      <div class="dday-num" id="ddayNum">-</div>
      <div class="dday-info">
        <div class="dday-label">시험까지 남은 날</div>
        <div class="dday-exam" id="ddayExam">-</div>
        <div class="dday-msg" id="ddayMsg">매일 10문제씩!</div>
      </div>
    </div>

    <!-- 오늘 인증 -->
    <div class="checkin-card">
      <div class="checkin-title">
        📝 오늘 공부 인증
        <span class="today-badge" id="checkinBadge" style="display:none">오늘 인증 완료 ✅</span>
      </div>

      <div class="type-tabs">
        <div class="type-tab active" data-type="problem" onclick="selectType(this)">
          <span class="tt-icon">📝</span>문제풀이
        </div>
        <div class="type-tab" data-type="concept" onclick="selectType(this)">
          <span class="tt-icon">📖</span>개념학습
        </div>
        <div class="type-tab" data-type="lecture" onclick="selectType(this)">
          <span class="tt-icon">🎥</span>인강시청
        </div>
        <div class="type-tab" data-type="wrongnote" onclick="selectType(this)">
          <span class="tt-icon">📓</span>오답노트
        </div>
      </div>

      <div class="subject-chips" id="subjectChips">
        <div class="subject-chip" data-sub="회로이론"   onclick="toggleSubject(this)">⚡ 회로이론</div>
        <div class="subject-chip" data-sub="전기자기학" onclick="toggleSubject(this)">🧲 전자기학</div>
        <div class="subject-chip" data-sub="제어공학"   onclick="toggleSubject(this)">🎛️ 제어공학</div>
        <div class="subject-chip" data-sub="전력공학"   onclick="toggleSubject(this)">🏭 전력공학</div>
        <div class="subject-chip" data-sub="전기기기"   onclick="toggleSubject(this)">⚙️ 전기기기</div>
        <div class="subject-chip" data-sub="KEC"        onclick="toggleSubject(this)">📋 KEC</div>
      </div>

      <div class="count-row">
        <span class="count-label" id="countLabel">기출 문제 수</span>
        <input class="count-input" type="number" id="problemCount" placeholder="0" min="0" max="999">
        <span class="count-label" id="countUnit">문제</span>
      </div>
      <textarea class="memo-input" id="studyMemo" placeholder="오늘 공부 한 줄 소감 (선택)"></textarea>
      <button class="btn-checkin" id="checkinBtn" onclick="submitCheckin()">✅ 오늘 인증하기</button>
    </div>

    <!-- 피드 -->
    <div class="section-card" style="padding:18px 20px 10px;margin-bottom:0">
      <div class="section-title">📋 멤버들의 오늘</div>
    </div>
    <div class="feed-grid" id="feedList">
      <div class="loading" style="grid-column:1/-1">⚡ 불러오는 중...</div>
    </div>

  </div>

  <div id="navMount"></div>
</div>
<div class="toast" id="toast"></div>
<script src="common.js"></script>
<script>
let currentUser     = null;
let myData          = {};
let selectedSubjects= [];
let selectedType    = 'problem';
let todayCheckedIn  = false;

mountLayout('📋 오늘의 피드', 'feed');

requireAuth(async user => {
  currentUser = user;
  myData = await fetchMyData(user.uid);
  renderSidebarUser(user, myData);
  updateDDay();
  checkTodayCheckin();
  loadFeed();
});

function updateDDay() {
  const exam  = myData.examDate ? new Date(myData.examDate) : new Date(2027,0,20);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff  = Math.ceil((exam - today) / 86400000);
  document.getElementById('ddayNum').textContent  = Math.max(0, diff);
  document.getElementById('ddayExam').textContent = `${exam.getFullYear()}년 ${exam.getMonth()+1}월 ${exam.getDate()}일 필기시험`;
  document.getElementById('ddayMsg').textContent  = diff > 30
    ? '지금부터 기출 10문제씩! 습관이 합격을 만들어요 💪'
    : diff > 7 ? '막판 스퍼트! 오답노트 집중 🔥' : '거의 다 왔어요! 컨디션 관리 💪';
}

function selectType(el) {
  selectedType = el.dataset.type;
  document.querySelectorAll('.type-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const cfg = CHECKIN_TYPES[selectedType];
  document.getElementById('countLabel').textContent = cfg.countLabel;
  document.getElementById('countUnit').textContent  = cfg.unit;
}

function toggleSubject(el) {
  el.classList.toggle('selected');
  const sub = el.dataset.sub;
  if (el.classList.contains('selected')) { if (!selectedSubjects.includes(sub)) selectedSubjects.push(sub); }
  else { selectedSubjects = selectedSubjects.filter(s => s !== sub); }
}

async function checkTodayCheckin() {
  const snap = await db.collection('checkins')
    .where('uid','==',currentUser.uid).where('date','==',todayStr()).limit(1).get();
  todayCheckedIn = !snap.empty;
  if (todayCheckedIn) {
    document.getElementById('checkinBtn').textContent = '✅ 오늘 인증 완료!';
    document.getElementById('checkinBtn').disabled = true;
    document.getElementById('checkinBadge').style.display = '';
  }
}

async function submitCheckin() {
  if (todayCheckedIn) { showToast('오늘은 이미 인증했어요! 내일 또 봐요 💪'); return; }
  if (selectedSubjects.length === 0) { showToast('과목을 선택해주세요!'); return; }
  const count = parseInt(document.getElementById('problemCount').value) || 0;
  if (count === 0) { showToast('학습량을 입력해주세요!'); return; }
  const memo = document.getElementById('studyMemo').value.trim();
  const btn  = document.getElementById('checkinBtn');
  btn.disabled = true; btn.textContent = '저장 중...';
  try {
    const today = todayStr();
    const udata = (await db.collection('users').doc(currentUser.uid).get()).data();
    const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
    const yStr  = `${yesterday.getFullYear()}-${String(yesterday.getMonth()+1).padStart(2,'0')}-${String(yesterday.getDate()).padStart(2,'0')}`;
    const checkins = udata.checkinDates || [];
    const streak   = checkins.includes(yStr) ? (udata.streak||0)+1 : 1;
    const subjUpdate = {};
    const oldSubs = udata.subjects || {};
    selectedSubjects.forEach(s => { subjUpdate[`subjects.${s}`] = (oldSubs[s]||0) + count; });
    await db.collection('users').doc(currentUser.uid).update({
      streak, totalProblems: (udata.totalProblems||0)+count,
      totalDays: (udata.totalDays||0)+1,
      lastCheckin: firebase.firestore.FieldValue.serverTimestamp(),
      checkinDates: firebase.firestore.FieldValue.arrayUnion(today),
      ...subjUpdate
    });
    await db.collection('checkins').add({
      uid: currentUser.uid, nickname: udata.nickname,
      type: selectedType, date: today,
      subjects: selectedSubjects, count, memo, streak, cheers: 0,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    myData = await fetchMyData(currentUser.uid);
    todayCheckedIn = true;
    btn.textContent = '✅ 오늘 인증 완료!';
    document.getElementById('checkinBadge').style.display = '';
    showToast(`🔥 ${streak}일 연속 출석! ${count}${CHECKIN_TYPES[selectedType].unit} 완료!`);
  } catch(e) {
    btn.disabled = false; btn.textContent = '✅ 오늘 인증하기';
    showToast('오류가 발생했어요'); console.error(e);
  }
}

function loadFeed() {
  const list = document.getElementById('feedList');
  list.innerHTML = '<div class="loading" style="grid-column:1/-1">⚡ 불러오는 중...</div>';
  db.collection('checkins').orderBy('createdAt','desc').limit(40).onSnapshot(snap => {
    if (snap.empty) {
      list.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="ei">📋</div><p>아직 인증이 없어요<br>첫 번째로 인증해보세요!</p></div>`;
      return;
    }
    list.innerHTML = snap.docs.map(renderFeedItem).join('');
  });
}

function renderFeedItem(doc) {
  const d    = doc.data();
  const col  = nickColor(d.nickname||'?');
  const ini  = nickInitial(d.nickname||'?');
  const cfg  = CHECKIN_TYPES[d.type] || CHECKIN_TYPES.problem;
  const subs = (d.subjects||[]).map(s=>`<span class="feed-subject-tag">${s}</span>`).join('');
  const admin = isAdmin(currentUser);
  const isMe  = d.uid === currentUser?.uid;

  return `
  <div class="feed-item">
    <div class="feed-item-top">
      <div class="feed-avatar" style="background:linear-gradient(135deg,${col},#0891b2)">${ini}</div>
      <div class="feed-meta">
        <div class="feed-name">${d.nickname||'익명'}${isMe?' <span style="font-size:11px;color:var(--t4)">(나)</span>':''}</div>
        <div class="feed-time">${timeAgo(d.createdAt)}</div>
      </div>
      ${d.streak>1?`<div class="feed-streak">🔥 ${d.streak}일</div>`:''}
    </div>
    ${subs?`<div class="feed-subjects">${subs}</div>`:''}
    <div class="feed-count">${cfg.icon} ${cfg.feedVerb} <strong>${d.count}${cfg.unit}</strong> 완료!</div>
    ${d.memo?`<div class="feed-memo">"${d.memo}"</div>`:''}
    <div class="feed-actions">
      <button class="btn-cheer" onclick="toggleCheer('${doc.id}',this)">
        💪 화이팅! ${d.cheers>0?`(${d.cheers})`:''}
      </button>
      ${(admin||isMe)?`<button class="btn-delete" onclick="deleteCheckin('${doc.id}')">🗑️ 삭제</button>`:''}
    </div>
  </div>`;
}

async function toggleCheer(docId, btn) {
  btn.classList.toggle('cheered');
  const inc = btn.classList.contains('cheered') ? 1 : -1;
  await db.collection('checkins').doc(docId).update({ cheers: firebase.firestore.FieldValue.increment(inc) });
  showToast(inc>0 ? '💪 화이팅 보냈어요!' : '취소했어요');
}

async function deleteCheckin(docId) {
  if (!confirm('인증 기록을 삭제할까요?')) return;
  try {
    await db.collection('checkins').doc(docId).delete();
    showToast('🗑️ 삭제됐어요');
  } catch(e) { showToast('삭제 중 오류 발생'); }
}
</script>
</body>
</html>
